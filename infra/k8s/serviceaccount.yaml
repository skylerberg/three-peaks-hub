apiVersion: v1
kind: ServiceAccount
metadata:
  name: three-peaks-hub-api
  namespace: three-peaks-hub
  annotations:
    # Workload Identity. This is what lets the pod reach the uploads bucket with
    # no key file: Application Default Credentials picks up the impersonation.
    iam.gke.io/gcp-service-account: three-peaks-hub-api@realm-construction.iam.gserviceaccount.com
